<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>병원 블로그 생성기</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#1d2330; --muted:#6b7280; --accent:#03c75a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { padding:20px 24px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { margin:0; font-size:18px; }
  main { display:grid; grid-template-columns:340px 1fr; gap:20px; padding:20px 24px; max-width:1300px; margin:0 auto; }
  @media (max-width:860px) { main { grid-template-columns:1fr; padding:16px; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; }
  .card + .card { margin-top:16px; }
  h2.sec { font-size:14px; margin:0 0 12px; color:var(--muted); font-weight:600; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 4px; }
  label small { font-weight:400; color:var(--muted); }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { font:inherit; border:0; border-radius:8px; padding:10px 14px; cursor:pointer; }
  .primary { width:100%; margin-top:16px; background:var(--accent); color:#fff; font-weight:700; }
  .primary:disabled { opacity:.6; cursor:wait; }
  .ghost { background:#eef0f3; }
  .topic { display:block; margin:0 0 8px; font-weight:400; cursor:pointer; }
  .topic input { position:absolute; opacity:0; width:auto; }
  .topic div { border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .topic b { display:block; font-size:14px; }
  .topic small { color:var(--muted); font-size:12px; }
  .topic input:checked + div { border-color:var(--accent); background:#f3faf6; box-shadow:0 0 0 1px var(--accent); }
  .topic input:focus-visible + div { outline:2px solid var(--text); }
  .topic input[type=text] { position:static; opacity:1; width:100%; margin-top:6px; }
  .cands { font-size:12px; color:var(--muted); margin:4px 0 0; }
  h2.sec small { font-weight:400; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:5px 0; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; color:var(--muted); }
  .paper { font-size:13px; margin-bottom:12px; }
  .paper a { color:var(--text); font-weight:600; }
  .paper p { margin:4px 0 0; color:var(--muted); }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .toolbar .count { margin-left:auto; color:var(--muted); font-size:13px; }
  #preview { min-height:400px; }
  #preview h1 { font-size:24px; } #preview h2 { font-size:20px; margin-top:28px; } #preview h3 { font-size:17px; }
  #preview blockquote { margin:0; padding:8px 14px; border-left:3px solid var(--accent); background:#f3faf6; }
  .empty { color:var(--muted); text-align:center; padding:120px 0; }
  .warn { background:#fff7e6; border:1px solid #ffd591; border-radius:8px; padding:8px 12px; font-size:13px; margin-bottom:12px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1d2330; color:#fff; padding:8px 16px; border-radius:8px; opacity:0; transition:opacity .2s; }
  .toast.show { opacity:1; }
  .bench th { font-size:12px; color:var(--muted); text-align:left; padding:4px 0; border-bottom:1px solid var(--line); font-weight:400; }
  .bench td { text-align:right; color:var(--text); }
  .bench td:first-child { text-align:left; padding-right:6px; color:var(--muted); }
  .bench td:nth-child(2) { text-align:left; padding-right:6px; }
  .bench th { white-space:nowrap; padding-left:4px; }
  .bench a { color:var(--text); display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  ul.tight { margin:6px 0; padding-left:18px; font-size:13px; }
  .pill { display:inline-block; font-size:12px; background:#fff1f0; border:1px solid #ffccc7; border-radius:99px; padding:2px 8px; margin:2px 4px 2px 0; }
  .chk { display:flex; gap:6px; align-items:center; font-weight:400; font-size:13px; margin:6px 0; }
  .chk input[type=checkbox] { width:auto; }
  .chk input[type=number] { width:80px; padding:4px 6px; }
  .score { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin-bottom:12px; }
  @media (max-width:600px) { .score { grid-template-columns:repeat(2,1fr); } }
  .score div { border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; color:var(--muted); }
  .score b { display:block; font-size:18px; color:#03a04a; }
  .score .low b { color:#d46b08; }
  .cmp-card { margin-bottom:12px; }
  .bench tr.avg td { color:var(--muted); }
  .bench tr.me td { background:#f3faf6; font-weight:700; border-top:2px solid var(--accent); border-bottom:2px solid var(--accent); }
  .bench td.low { color:#d46b08; }
  .tag { font-size:11px; background:var(--accent); color:#fff; border-radius:4px; padding:1px 5px; margin-right:4px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:14px; }
  @media (max-width:700px) { .cols { grid-template-columns:1fr; } }
  .cols .chk { align-items:flex-start; }
  .cols .chk label { margin:0; font-weight:400; }
  .have { color:#03a04a; font-size:13px; } .miss { color:#d46b08; font-size:13px; }
  #side { position:fixed; inset:0; background:var(--bg); z-index:10; display:flex; flex-direction:column; padding:12px 20px; gap:10px; }
  #side[hidden] { display:none; }
  .side-head { display:flex; justify-content:space-between; align-items:center; }
  #insights { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; font-size:13px; max-height:34vh; overflow:auto; }
  #insights > div { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  #insights p { margin:6px 0; } #insights .primary { margin-top:8px; padding:8px; }
  .split { display:grid; grid-template-columns:1fr 1fr; gap:12px; flex:1; min-height:0; }
  @media (max-width:860px) { #insights, .split { grid-template-columns:1fr; } #side { overflow:auto; } .split { flex:none; } }
  .pane { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; overflow:auto; }
  .pane h1 { font-size:20px; } .pane h2 { font-size:17px; margin-top:22px; } .pane p { font-size:14px; }
  .pane blockquote { margin:10px 0; padding:8px 14px; border-left:3px solid var(--accent); background:#f3faf6; font-size:14px; }
  .pane .slot { border:2px dashed #cfd4da; color:var(--muted); font-size:12px; padding:8px; text-align:center; border-radius:8px; }
  .pane .tbl { font-size:12px; color:var(--muted); background:#f6f7f9; padding:8px; border-radius:6px; }
  .hdr { font-size:13px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; margin:0 0 8px; position:sticky; top:-16px; background:var(--card); padding:6px 0; }
  .side-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; align-items:center; }
  .side-tabs button { background:#eef0f3; font-size:13px; padding:6px 10px; }
  .side-tabs button.on { background:var(--accent); color:#fff; }
  .ghost-link { margin-left:auto; font-size:13px; color:var(--muted); }
  mark { background:#fff3b0; }
  #preview .slot { border:2px dashed #bfe8cf; background:#f3faf6; color:#03a04a; padding:12px; border-radius:8px; }
</style>
</head>
<body>
<header><h1>병원 블로그 글 생성기</h1></header>
<main>
  <aside>
    <form class="card" id="form">
      <h2 class="sec">입력</h2>
      <label for="keyword">메인 키워드</label>
      <input id="keyword" required maxlength="50" placeholder="예: 허리디스크">
      <label for="hospital">병원명 <small>선택</small></label>
      <input id="hospital" maxlength="50" placeholder="예: ○○정형외과">
      <button class="primary" id="find">① 세부 주제 찾기</button>
    </form>
    <section class="card" id="benchCard" hidden>
      <h2 class="sec">상위글 분석 <small>네이버 블로그 상위 5개</small></h2>
      <div id="bench"></div>
    </section>
    <section class="card" id="topicCard" hidden>
      <h2 class="sec">세부 주제 추천 <small id="topicCost"></small></h2>
      <div id="topics"></div>
      <p class="cands" id="cands"></p>
      <button class="primary" id="go">② 이 주제로 글 생성</button>
    </section>
    <section class="card" id="kwCard" hidden><h2 class="sec">연관 키워드 (월 검색량)</h2><table id="kw"></table></section>
    <section class="card" id="paperCard" hidden><h2 class="sec">참고 논문</h2><div id="papers"></div></section>
  </aside>

  <section class="card">
    <div class="toolbar">
      <button class="ghost" id="copyRich" disabled>블로그용 복사</button>
      <button class="ghost" id="copyHtml" disabled>HTML 복사</button>
      <span class="count" id="count"></span>
    </div>
    <div id="score"></div>
    <div id="compare"></div>
    <div id="warnings"></div>
    <article id="preview"><p class="empty">키워드를 입력하고 글을 생성하세요.</p></article>
  </section>
</main>
<div id="side" hidden>
  <div class="side-head"><b>내 글 vs 상위 노출 글</b><button class="ghost" onclick="closeSide()">닫기 ✕</button></div>
  <div id="insights"></div>
  <div class="split">
    <section class="pane" id="sideMine"></section>
    <section class="pane"><div class="side-tabs" id="sideTabs"></div><div id="sideTop"></div></section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let html = "";

function toast(msg) {
  $("toast").textContent = msg;
  $("toast").classList.add("show");
  setTimeout(() => $("toast").classList.remove("show"), 1500);
}

let suggestion = null;  // /api/subtopics 결과
let bench = null;       // /api/benchmark 결과

// 상위글 분석: 세부 주제 찾기와 동시에 실행. 실패해도 글 생성은 그대로 가능
async function loadBench(keyword) {
  bench = null;
  $("benchCard").hidden = false;
  $("bench").innerHTML = '<p class="cands">상위 글 읽고 분석하는 중… (30초 안팎)</p>';
  try {
    bench = await post("/api/benchmark", {keyword});
  } catch (err) {
    $("bench").innerHTML = `<p class="cands">분석 실패: ${esc(err.message)}<br>기준 없이 글 생성은 가능합니다.</p>`;
    return;
  }
  const t = bench.targets;
  const rows = bench.posts.map(p => `<tr><td>${p.rank}</td><td><a href="${esc(p.url)}" target="_blank" rel="noopener" title="${esc(p.title)}">${esc(p.title)}</a></td>
    <td>${p.chars.toLocaleString()}</td><td>${p.images}</td><td>${p.keyword_count}</td></tr>`).join("");
  const titles = bench.titles.map((x, i) => `<label class="topic"><input type="radio" name="title" value="${i}">
    <div><b>${esc(x)}</b></div></label>`).join("");
  $("bench").innerHTML = `
    <table class="bench"><tr><th>#</th><th>제목</th><th>글자</th><th>사진</th><th>키워드</th></tr>${rows}</table>
    <label>왜 상위일까</label><ul class="tight">${bench.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    <label>이 기준으로 씁니다 <small>숫자는 고칠 수 있음</small></label>
    <div class="chk"><input type="checkbox" id="tChars" checked><label for="tChars">분량</label><input type="number" id="vChars" value="${t.chars}" step="100" min="1000" max="8000">자</div>
    <div class="chk"><input type="checkbox" id="tKw" checked><label for="tKw">키워드 "${esc(bench.keyword)}"</label><input type="number" id="vKw" value="${t.keyword_count}" min="1" max="60">회</div>
    <div class="chk"><input type="checkbox" id="tImg" checked><label for="tImg">사진 자리 표시</label><input type="number" id="vImg" value="${t.images}" min="1" max="30">곳</div>
    <div class="chk"><input type="checkbox" id="tQuote" checked><label for="tQuote">인용구 상자</label><input type="number" id="vQuote" value="${t.quotes}" min="1" max="20">개</div>
    <div class="chk"><input type="checkbox" id="tTitle" checked><label for="tTitle">제목: 키워드로 시작 + 질문형</label></div>
    <label>추천 제목 <small>고르면 그대로 사용</small></label>
    <label class="topic"><input type="radio" name="title" value="" checked><div><b>고르지 않음</b><small>형식만 맞춰 새로 짓기</small></div></label>
    ${titles}
    ${bench.avoid.length ? `<label>따라 하지 않음 <small>의료광고법</small></label>${bench.avoid.map(a => `<span class="pill">${esc(a)}</span>`).join("")}` : ""}`;
}

function chosenTargets() {
  if (!bench) return null;
  const on = id => $(id).checked;
  const title = document.querySelector("input[name=title]:checked").value;
  return {
    chars: on("tChars") ? +$("vChars").value : null,
    keyword_count: on("tKw") ? +$("vKw").value : null,
    images: on("tImg") ? +$("vImg").value : null,
    quotes: on("tQuote") ? +$("vQuote").value : null,
    title: on("tTitle") && title !== "" ? bench.titles[+title] : "",
    title_pattern: on("tTitle"),
  };
}

// 완성 글이 기준을 지켰는지. 90% 미만(키워드는 과다도) 주황
let lastCells = [];     // 점수표 칸 [이름, 값, 목표, 모자람]
let lastCompare = null; // /api/compare 결과

// 키워드를 노란색으로. 이미 이스케이프된 HTML의 태그 밖 텍스트에만 적용
function markKw(safeHtml, keyword) {
  const kw = esc(keyword);
  return safeHtml.replace(/(^|>)([^<]*)/g, (_, a, t) => a + t.split(kw).join(`<mark>${kw}</mark>`));
}

// 나란히 보기: 위에 분석 4칸, 아래 왼쪽 내 글 / 오른쪽 상위 글
function openSide(keyword, me) {
  $("side").hidden = false;
  document.body.style.overflow = "hidden";
  $("sideMine").innerHTML = `<p class="hdr"><b>내 글</b><span>${me.chars.toLocaleString()}자 · 사진 ${me.images} · 인용구 ${me.quotes} · 키워드 ${me.keyword_count}</span></p>`
    + markKw($("preview").innerHTML, keyword);
  $("sideTabs").innerHTML = bench.posts.map((p, i) => `<button data-i="${i}">${p.rank}위</button>`).join("")
    + `<a class="ghost-link" id="sideLink" target="_blank" rel="noopener">네이버에서 열기 ↗</a>`;
  $("sideTabs").querySelectorAll("button").forEach(b => b.onclick = () => showTop(+b.dataset.i, keyword));
  showTop(0, keyword);
}

function showTop(i, keyword) {
  const p = bench.posts[i];
  $("sideTabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.i === i));
  $("sideLink").href = p.url;
  const block = b => ({
    h: `<h2>${markKw(esc(b.x), keyword)}</h2>`,
    p: `<p>${markKw(esc(b.x), keyword)}</p>`,
    quote: `<blockquote>${markKw(esc(b.x), keyword)}</blockquote>`,
    img: '<p class="slot">📷 사진</p>',
    table: `<p class="tbl">표 · ${esc(b.x)}</p>`,
  }[b.t] || "");
  $("sideTop").innerHTML = `<p class="hdr"><b>${p.rank}위 글</b><span>${p.chars.toLocaleString()}자 · 사진 ${p.images} · 인용구 ${p.quotes} · 키워드 ${p.keyword_count}</span></p>
    <h1>${markKw(esc(p.title), keyword)}</h1>${(p.blocks || []).map(block).join("") || '<p class="cands">본문을 읽지 못했습니다. 네이버에서 열어 보세요.</p>'}`;
  $("sideTop").scrollTop = 0;
  sideRank = i;
  renderInsights();
}

let sideRank = 0;
function renderInsights() {
  const li = xs => xs.length ? `<ul class="tight">${xs.map(x => `<li>${x}</li>`).join("")}</ul>` : '<p class="cands">없음</p>';
  const c = lastCompare, wait = '<p class="cands">내용 비교 중… 잠시 후 채워집니다</p>';
  const ok = lastCells.filter(x => !x[3]).map(([k, v, g]) => `${esc(k)} ${esc(v)} <small>(${esc(g)})</small>`);
  const bad = lastCells.filter(x => x[3]).map(([k, v, g]) => `<b>${esc(k)}</b> ${esc(v)} → ${esc(g)}`);
  $("insights").innerHTML = `
    <div><b>상위 노출 글 공통점</b>${li(bench.reasons.map(esc))}</div>
    <div><b>${bench.posts[sideRank].rank}위 글은 어떤 글?</b><p>${esc(bench.notes?.[sideRank] || "분석 없음")}</p></div>
    <div><b class="have">내 글에 반영된 것</b>${li(ok)}${c ? li([...c.covered.map(x => "다룬 주제: " + esc(x)), ...c.strengths.map(x => "강점: " + esc(x))]) : wait}</div>
    <div><b class="miss">보완하면 좋은 것</b>${bad.length ? li(bad) : ""}${c ? li(c.missing.map(m => `<b>${esc(m.topic)}</b> · 상위 ${m.posts}개 글 <small>${esc(m.note)}</small>`)) : wait}
      ${c?.missing.length ? '<button class="primary" id="sideSupplement">보충해서 다시 쓰기</button>' : ""}</div>`;
  if (c?.missing.length) $("sideSupplement").onclick = () => { closeSide(); $("supplement").click(); };
}

function closeSide() { $("side").hidden = true; document.body.style.overflow = ""; }

// 사진 자리 표시는 발행 때 사진으로 바뀌므로 글자·키워드 수에서 뺌
const bodyText = () => [...$("preview").children].filter(e => !e.classList.contains("slot")).map(e => e.innerText).join("\n");
const countKw = (text, keyword) => text.replace(/\s/g, "").split(keyword.replace(/\s/g, "")).length - 1;

function renderScore(t, keyword) {
  if (!t) return $("score").innerHTML = "";
  const text = bodyText();
  const kw = keyword.replace(/\s/g, "");
  const h1 = ($("preview").querySelector("h1")?.innerText || "").replace(/\s/g, "");
  const cells = [];
  if (t.chars) cells.push(["글자 수", text.length.toLocaleString(), `목표 ${t.chars.toLocaleString()}`, text.length < t.chars * .9]);
  if (t.keyword_count) {
    const n = countKw(text, keyword);
    cells.push(["키워드", `${n}회`, `목표 ${t.keyword_count}회`, n < t.keyword_count * .7 || n > t.keyword_count * 1.5]);
  }
  if (t.images) {
    const n = $("preview").querySelectorAll(".slot").length;
    cells.push(["사진 자리", `${n}곳`, `목표 ${t.images}곳`, n < t.images * .9]);
  }
  if (t.quotes) {
    const n = $("preview").querySelectorAll("blockquote").length;
    cells.push(["인용구", `${n}개`, `목표 ${t.quotes}개`, n < t.quotes * .7]);
  }
  if (t.title_pattern) {
    const ok = h1.startsWith(kw) && h1.includes("?");
    cells.push(["제목 형식", ok ? "맞음" : "다름", "키워드 시작 + 질문형", !ok]);
  }
  lastCells = cells;
  $("score").innerHTML = `<p class="cands" style="margin:0 0 6px">완성 글 vs 상위글 기준</p><div class="score">` +
    cells.map(([k, v, goal, low]) => `<div class="${low ? "low" : ""}">${k}<b>${v}</b>${goal}</div>`).join("") + "</div>";
}

// 내 글 vs 상위 5개: 숫자 표는 바로, 내용 비교는 Claude 호출 후
async function renderCompare(keyword) {
  if (!bench) return $("compare").innerHTML = "";
  const text = bodyText(), top = bench.posts.slice(0, 3);
  const avg = k => Math.round(top.reduce((s, p) => s + p[k], 0) / top.length);
  const me = {
    title: $("preview").querySelector("h1")?.innerText || "", chars: text.length,
    images: $("preview").querySelectorAll(".slot").length,
    quotes: $("preview").querySelectorAll("blockquote").length, keyword_count: countKw(text, keyword),
  };
  const low = k => me[k] < avg(k) * .9 ? ' class="low"' : "";
  const row = p => `<td>${p.chars.toLocaleString()}</td><td>${p.images}</td><td>${p.quotes}</td><td>${p.keyword_count}</td>`;
  $("compare").innerHTML = `<div class="card cmp-card">
    <h2 class="sec">내 글 vs 상위 5개</h2>
    <table class="bench cmp"><tr><th>#</th><th>제목</th><th>글자</th><th>사진</th><th>인용구</th><th>키워드</th></tr>
    ${bench.posts.map(p => `<tr><td>${p.rank}</td><td><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></td>${row(p)}</tr>`).join("")}
    <tr class="avg"><td></td><td>1~3위 평균</td><td>${avg("chars").toLocaleString()}</td><td>${avg("images")}</td><td>${avg("quotes")}</td><td>${avg("keyword_count")}</td></tr>
    <tr class="me"><td>👉</td><td><span class="tag">내 글</span>${esc(me.title)}</td><td${low("chars")}>${me.chars.toLocaleString()}</td>
      <td${low("images")}>${me.images}</td><td${low("quotes")}>${me.quotes}</td><td${low("keyword_count")}>${me.keyword_count}</td></tr></table>
    <button class="primary" id="openSide" style="max-width:320px">상위 글과 나란히 보기</button>
    <div id="content"><p class="cands">상위 글과 내용 비교하는 중… (30초 안팎)</p></div></div>`;
  lastCompare = null;
  $("openSide").onclick = () => openSide(keyword, me);
  let c;
  try {
    c = await post("/api/compare", {keyword, my_text: text, posts: bench.posts.map(({rank, title, text}) => ({rank, title, text}))});
  } catch (err) {
    return $("content").innerHTML = `<p class="cands">내용 비교 실패: ${esc(err.message)}</p>`;
  }
  lastCompare = c;
  if (!$("side").hidden) renderInsights();
  const li = xs => xs.map(x => `<li>${esc(x)}</li>`).join("");
  $("content").innerHTML = `<div class="cols">
      <div><b class="have">상위 글도, 내 글도 다룬 것</b><ul class="tight">${li(c.covered)}</ul></div>
      <div><b class="miss">상위 글엔 있는데 내 글엔 없는 것</b>${c.missing.length ? c.missing.map((m, i) => `
        <div class="chk"><input type="checkbox" id="miss${i}" checked><label for="miss${i}"><b>${esc(m.topic)}</b> · 상위 ${m.posts}개 글<br><small>${esc(m.note)}</small></label></div>`).join("")
        : '<p class="cands">빠진 주제 없음</p>'}</div></div>
    ${c.strengths.length ? `<p style="font-size:13px;margin:10px 0 0"><b>내 글만의 강점</b> · ${c.strengths.map(esc).join(" · ")}</p>` : ""}
    ${c.missing.length ? '<button class="primary" id="supplement" style="max-width:320px">체크한 내용 보충해서 다시 쓰기</button>' : ""}`;
  if (c.missing.length) $("supplement").onclick = () => {
    const picks = c.missing.filter((_, i) => $(`miss${i}`).checked).map(m => `${m.topic} (${m.note})`);
    if (!picks.length) return toast("보충할 내용을 하나 이상 체크해 주세요");
    runGenerate({...lastBody, revise_html: html, supplement: picks}, "보충해서 다시 쓰는 중…");
  };
}

async function post(url, body) {
  const res = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await res.json();
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail));
  return data;
}

// ① 네이버 자동완성 → 세부 주제 3개 추천
$("form").onsubmit = async e => {
  e.preventDefault();
  $("find").disabled = true;
  $("find").textContent = "주제 찾는 중…";
  loadBench($("keyword").value.trim());
  try {
    suggestion = await post("/api/subtopics", {keyword: $("keyword").value.trim()});
    const opts = suggestion.subtopics.map((t, i) => `
      <label class="topic"><input type="radio" name="topic" value="${i}" ${i === 0 ? "checked" : ""}>
        <div><b>${esc(t.search_keyword)}</b><small>${esc(t.intent)}</small></div></label>`);
    opts.push(`<label class="topic"><input type="radio" name="topic" value="all">
        <div><b>${esc($("keyword").value.trim())} 전반</b><small>세부 주제 없이 전체적으로</small></div></label>`);
    opts.push(`<label class="topic"><input type="radio" name="topic" value="custom">
        <div><b>직접 입력</b><input type="text" id="customSub" maxlength="30" placeholder="예: 임산부, 20대"></div></label>`);
    $("topics").innerHTML = opts.join("");
    $("customSub").onfocus = () => { document.querySelector("input[name=topic][value=custom]").checked = true; };
    $("cands").textContent = suggestion.candidates.length ? `네이버 자동완성: ${suggestion.candidates.join(", ")}` : "";
    $("topicCost").textContent = suggestion.api_equivalent_usd ? `(API였다면 약 $${suggestion.api_equivalent_usd.toFixed(3)})` : "";
    $("topicCard").hidden = false;
  } catch (err) {
    toast(`오류: ${err.message}`);
  } finally {
    $("find").disabled = false;
    $("find").textContent = "① 세부 주제 찾기";
  }
};

// ② 선택한 주제로 글 생성
$("go").onclick = async () => {
  const pick = document.querySelector("input[name=topic]:checked").value;
  const targets = chosenTargets();
  const body = {keyword: $("keyword").value.trim(), hospital: $("hospital").value.trim(), pubmed_query: suggestion.disease_en, targets};
  if (pick === "custom") {
    body.subtopic = $("customSub").value.trim();
    if (!body.subtopic) return toast("직접 입력할 주제를 적어 주세요");
  } else if (pick !== "all") {
    const t = suggestion.subtopics[+pick];
    Object.assign(body, {subtopic: t.topic, intent: t.intent, pubmed_query: t.pubmed_query});
  }
  lastBody = body;
  runGenerate(body, "키워드·논문 수집 후 글을 쓰는 중입니다…");
};

let lastBody = null;  // 보충해서 다시 쓰기 때 같은 조건으로 재요청

async function runGenerate(body, waitMsg) {
  const targets = body.targets;
  $("go").disabled = true;
  $("go").textContent = "생성 중… (1~2분)";
  $("preview").innerHTML = `<p class="empty">${waitMsg}</p>`;
  $("warnings").innerHTML = $("score").innerHTML = $("compare").innerHTML = "";
  $("copyRich").disabled = $("copyHtml").disabled = true;
  try {
    const data = await post("/api/generate", body);

    html = data.html;
    // Claude가 만든 HTML이지만 script 등은 막기 위해 허용 태그만 남김
    const doc = new DOMParser().parseFromString(html, "text/html");
    doc.querySelectorAll("*").forEach(el => {
      if (!/^(HTML|HEAD|BODY|H1|H2|H3|P|UL|OL|LI|STRONG|EM|BLOCKQUOTE|BR)$/.test(el.tagName)) el.replaceWith(...el.childNodes);
      else [...el.attributes].forEach(a => el.removeAttribute(a.name));
    });
    $("preview").innerHTML = doc.body.innerHTML;
    $("preview").querySelectorAll("p").forEach(p => { if (p.innerText.startsWith("📷")) p.className = "slot"; });
    renderScore(targets, body.keyword);
    const via = data.engine === "claude-code"
      ? `Claude Code 구독 사용${data.api_equivalent_usd ? ` (API였다면 약 $${data.api_equivalent_usd.toFixed(2)})` : ""}`
      : "Anthropic API 사용";
    $("count").textContent = `${$("preview").innerText.length.toLocaleString()}자 · ${via}`;
    $("copyRich").disabled = $("copyHtml").disabled = false;

    $("warnings").innerHTML = data.warnings.map(w => `<div class="warn">${esc(w)}</div>`).join("");
    $("kwCard").hidden = !data.keywords.length;
    $("kw").innerHTML = data.keywords.map(k => `<tr><td>${esc(k.keyword)}</td><td>${k.total.toLocaleString()}</td></tr>`).join("");
    $("paperCard").hidden = !data.papers.length;
    $("papers").innerHTML = data.papers.map(p =>
      `<div class="paper"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
       <p>${esc(p.journal)} · ${esc(p.year)}</p><p>${esc(p.summary)}</p></div>`).join("");
  } catch (err) {
    $("preview").innerHTML = `<p class="empty">오류: ${esc(err.message)}</p>`;
    return;
  } finally {
    $("go").disabled = false;
    $("go").textContent = "② 이 주제로 글 생성";
  }
  renderCompare(body.keyword);
}

// 네이버 스마트에디터에 붙여넣으면 제목·소제목 서식이 유지됨
$("copyRich").onclick = async () => {
  const rich = $("preview").innerHTML;
  await navigator.clipboard.write([new ClipboardItem({
    "text/html": new Blob([rich], {type: "text/html"}),
    "text/plain": new Blob([$("preview").innerText], {type: "text/plain"}),
  })]);
  toast("서식 포함 복사됨");
};
$("copyHtml").onclick = async () => { await navigator.clipboard.writeText(html); toast("HTML 복사됨"); };
</script>
</body>
